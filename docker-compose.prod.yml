# Production stack: pulls published images, builds nothing.
#
#   cp .env.prod.example .env && $EDITOR .env
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Every secret comes from the environment — nothing sensitive is defaulted here, and the `:?`
# forms make a missing one fail at `up` instead of booting something half-configured. See
# .env.prod.example for the full list.
#
# Ingress is your choice, and the two modes are mutually exclusive in practice:
#
#   default          web is published on ${WEB_PORT:-8080}. Point your own reverse proxy
#                    (Caddy, Traefik, nginx, NPM) at it, or reach it directly on the LAN.
#   COMPOSE_PROFILES=cloudflare
#                    additionally runs a Cloudflare Tunnel, so the stack is reachable from the
#                    internet with no inbound port open on the router. Set
#                    WEB_PORT=127.0.0.1:8080 alongside it to keep the host port loopback-only.
#
# Anything that terminates TLS lives outside this file — the web container speaks plain HTTP.
#
# The server additionally publishes ${ADMIN_PORT:-8081} on 127.0.0.1, which is *not* ingress:
# it is the operator's only path to the endpoints the web container hides from the internet
# (/v1/register, /v1/keys, /v1/admin/*). Keep it distinct from WEB_PORT — see the server
# service below for why they cannot share a number.

name: ovlive

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ovlive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the host environment}
      POSTGRES_DB: ${POSTGRES_DB:-ovlive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ovlive} -d ${POSTGRES_DB:-ovlive}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    # ovlive-platform-api, not ovlive-server: a ghcr namespace is per *owner*, not per repo, so
    # the repo-prefixed name keeps these images from colliding with anything else the owner
    # publishes. The compose service names below stay `server` and `web` — nginx proxies to
    # `server:8080` by name, so those are load-bearing.
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX must be set, e.g. ghcr.io/your-github-username}/ovlive-platform-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Fair use: exactly one ZMQ SUB connection per NDOV datastream, per process. This service
    # holds all three (KV6, KV78Turbo, NS InfoPlus), so it must never be scaled past 1 replica
    # — two containers means two subscriptions and risks the project being blocked upstream.
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-ovlive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ovlive}
      DATA_DIR: /data
      RUST_LOG: ${RUST_LOG:-info,ovlive=info}

      # --- GTFS static (STRICT policy — see CLAUDE.md) ---
      GTFS_URL: https://gtfs.ovapi.nl/gtfs-nl.zip
      # Must name the app *and* a contact address the operators can actually reach. Required
      # rather than defaulted: `:?` rejects an empty value too, and an empty GTFS_USER_AGENT
      # would override the binary's built-in default with no identification at all — the one
      # failure mode the policy exists to prevent.
      GTFS_USER_AGENT: "${GTFS_USER_AGENT:?GTFS_USER_AGENT must name your deployment and a contact address the feed operators can actually reach, e.g. OVLive/0.1 (+contact: you@example.com) — see the data-source policy in CLAUDE.md}"
      GTFS_REFRESH_TZ: Europe/Amsterdam
      GTFS_REFRESH_HOUR: "3"

      # --- Realtime feeds ---
      ZMQ_KV6_ENDPOINT: tcp://pubsub.besteffort.ndovloket.nl:7658
      ZMQ_KV78_ENDPOINT: tcp://pubsub.besteffort.ndovloket.nl:7817
      ZMQ_KV78_TOPICS: /GOVI/KV8passtimes/
      ZMQ_NS_ENDPOINT: tcp://pubsub.besteffort.ndovloket.nl:7664
      ZMQ_IDLE_TIMEOUT_SECS: "60"

      WS_TICK_HZ: ${WS_TICK_HZ:-3}
      PUBLIC_RATE_PER_MIN: ${PUBLIC_RATE_PER_MIN:-6000}

      # Seeded only on the first boot, while the users table is empty.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL must be set in the host environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in the host environment}
    # Loopback only, and only so the operator can reach the endpoints the web container hides
    # from the tunnel (/v1/register, /v1/keys, /v1/admin/*). Not ingress: 127.0.0.1 is not
    # routable from outside the host, so this is reachable over SSH to the host and nowhere
    # else. Drop this line and those endpoints become unreachable entirely.
    #
    # 8081, not 8080: web already claims ${WEB_PORT:-8080} on the host, and the two cannot
    # share it. A loopback binding does not "reserve less" than a wildcard one — binding
    # 0.0.0.0:8080 fails with EADDRINUSE once 127.0.0.1:8080 is taken, so a shared number
    # means whichever service starts second never comes up.
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8081}:8080"
    volumes:
      # Not a cache you can throw away. It holds the ~232 MiB gtfs-nl.zip and the snapshots the
      # server boots from; losing it forces a fresh download of the feed on next start, which
      # the data-source policy exists to avoid.
      - ovlive-data:/data
    # No healthcheck: the runtime image is distroless, so there is no shell, curl or wget to
    # run one with. Liveness is observable from outside via the web container's /health proxy.
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${IMAGE_PREFIX}/ovlive-platform-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # Empty = same origin: nginx proxies /v1, /health and /docs to the server itself, so the
      # whole app lives behind one Cloudflare hostname with no CORS and no cross-origin WS.
      # Set it only if you publish the API on a separate hostname.
      API_BASE: ${API_BASE:-}
      API_UPSTREAM: server:8080
    # The single entry point: the SPA, the REST API, /docs and the WebSocket all arrive here.
    # Accepts a bind address as well as a bare port, which is how the Cloudflare Tunnel setup
    # keeps this off the network entirely — WEB_PORT=127.0.0.1:8080.
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

  # Optional ingress, off unless you ask for it: COMPOSE_PROFILES=cloudflare.
  # Everything above runs without it, published on ${WEB_PORT:-8080} for your own reverse proxy.
  cloudflared:
    # Pinned by tag *and* digest so `up -d` can never silently swap the thing holding your
    # ingress: the digest is what docker actually resolves, the tag is there to be read. Bump
    # both together from https://github.com/cloudflare/cloudflared/releases — cloudflared warns
    # when it is too far behind, and Cloudflare eventually stops supporting very old builds, so
    # this is a deliberate periodic update, not a set-and-forget.
    image: cloudflare/cloudflared:2026.7.3@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    restart: unless-stopped
    profiles: ["cloudflare"]
    # A token-based (remotely-managed) tunnel: the public hostname and its routing live in the
    # Cloudflare Zero Trust dashboard, not in this repo. Point the tunnel's public hostname at
    # the service http://web:80 — that one route covers the SPA, the REST API, /docs and the
    # WebSocket. Turn on "WebSocket" support for the tunnel; /v1/stream needs it.
    command: tunnel --no-autoupdate run
    # Not `:?` like the other secrets, even though it is required whenever this service runs.
    # Compose interpolates the entire file before it filters by profile, so a `:?` here would
    # abort `up` for everyone who never opted into the tunnel. cloudflared exits with its own
    # clear error on an empty token, which only the people who did opt in ever see.
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    logging: *logging

volumes:
  pgdata:
  ovlive-data:
